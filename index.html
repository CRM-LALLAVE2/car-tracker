<!DOCTYPE html>
<html>
<head>
    <title>Car Tracker Dashboard</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100vw; }
        #info-box {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div id="info-box">
        <h3>Car Tracker</h3>
        <p id="status">Waiting for location...</p>
    </div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyBt5toZ4poHRuop53opN0ikXvULhzCkQDY",
  authDomain: "cartracker-16620.firebaseapp.com",
  databaseURL: "https://cartracker-16620-default-rtdb.firebaseio.com",
  projectId: "cartracker-16620",
  storageBucket: "cartracker-16620.firebasestorage.app",
  messagingSenderId: "974892728982",
  appId: "1:974892728982:web:3f2fb2389d447c5c5ef8b7"
};

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Initialize Map
        var map = L.map('map').setView([32.6245, -115.4523], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map);

        var marker = L.marker([0, 0]).addTo(map);

        // Listen for live updates from Firebase
        const carRef = ref(db, 'vehicles/my_car/latest');
        onValue(carRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                var lat = data.latitude;
                var lng = data.longitude;
                marker.setLatLng([lat, lng]);
                map.setView([lat, lng], 16);
                document.getElementById('status').innerText = `Last updated: ${new Date(data.timestamp).toLocaleTimeString()}`;
            } else {
                document.getElementById('status').innerText = "No location data yet.";
            }
        });
    </script>
</body>
</html>
